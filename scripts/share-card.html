<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Arte de compartilhamento do LUM4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#faf8f4;background:#0c0d0f}
.card{position:relative;width:1200px;height:630px;background:radial-gradient(ellipse at 24% 50%,#ff971a18,transparent 43%),radial-gradient(ellipse at 100% 100%,#ffb25a0e,transparent 57%),#0c0d0f;overflow:hidden}
.halo{position:absolute;width:280px;height:280px;left:263px;top:168px;border-radius:50%;background:#ffa62914;filter:blur(40px)}
.symbol{position:absolute;left:252px;top:163px;width:280px;height:280px}
.copy{position:absolute;left:583px;top:155px}
.wordmark{font-size:82px;font-weight:750;letter-spacing:-3px;line-height:1;margin:0}
.by{display:block;font-size:15px;letter-spacing:5px;margin-top:14px;color:#b6b2ac}
h1{font-size:47px;font-weight:580;letter-spacing:-1.5px;line-height:1.14;margin:33px 0 23px}
h1 span{color:#ffd1a0}
.features{font-size:20px;color:#b5b1aa;letter-spacing:.15px}
.features b{font-weight:400;padding:0 12px;color:#81664c}
.domain{position:absolute;right:66px;bottom:45px;color:#d9bd9e;font-size:19px;letter-spacing:1px}
.line{position:absolute;bottom:94px;left:66px;right:66px;height:1px;background:linear-gradient(90deg,transparent,#ffc07833,transparent)}
</style>
<div class="card">
  <div class="halo"></div>
  <img class="symbol" src="../dist/assets/lum4-symbol.svg" alt="">
  <div class="copy">
    <p class="wordmark">LUM4</p>

    <div class="features">macOS<b>·</b>Boost XDR<b>·</b>IA local</div>
  </div>
  <div class="line"></div><span class="domain">lum4.app</span>
</div>
</html>
